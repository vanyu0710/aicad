<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Varen CAD app icon</title>
  <desc id="desc">A cyan crescent moon drifting over a single isometric island and calm sea, on a deep-space blue rounded square.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050E1F"/>
      <stop offset="0.55" stop-color="#071B3A"/>
      <stop offset="1" stop-color="#0B4964"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0FBFF"/>
      <stop offset="0.55" stop-color="#9FF0FB"/>
      <stop offset="1" stop-color="#38C3E8"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky + soft glow -->
  <rect width="256" height="256" rx="56" fill="url(#sky)"/>
  <rect width="256" height="256" rx="56" fill="url(#wash)"/>

  <!-- stars -->
  <g fill="#CFFAFE">
    <circle cx="44" cy="48" r="1.6"/>
    <circle cx="74" cy="88" r="1.1" opacity="0.8"/>
    <circle cx="210" cy="120" r="1.4" opacity="0.7"/>
    <circle cx="40" cy="150" r="1.2" opacity="0.65"/>
    <circle cx="196" cy="44" r="1.3" opacity="0.9"/>
    <circle cx="150" cy="150" r="0.9" opacity="0.5"/>
  </g>

  <!-- crescent moon -->
  <circle cx="176" cy="60" r="38" fill="url(#moon)"/>
  <circle cx="192" cy="48" r="38" fill="#071B3A"/>

  <!-- sea horizon + waves -->
  <path d="M24 160c30-22 54-22 84 0s54 22 84 0 34-20 44-10" fill="none" stroke="#38C3E8" stroke-width="10" stroke-linecap="round"/>
  <path d="M24 186c30-22 54-22 84 0s54 22 84 0 34-20 44-10" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M24 210c30-22 54-22 84 0s54 22 84 0 34-20 44-10" fill="none" stroke="#155E75" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- isometric island + CAD reference mark -->
  <path d="M60 118 128 156l68-38v30l-68 38-68-38Z" fill="#0A3550" stroke="#A5F3FC" stroke-width="3.5"/>
  <path d="M60 118 128 156l68-38" fill="none" stroke="#5EEAD4" stroke-width="2" opacity="0.55"/>
  <path d="M128 156v30" stroke="#A5F3FC" stroke-width="3.5"/>
</svg>
